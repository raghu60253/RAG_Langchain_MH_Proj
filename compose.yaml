services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PDF_PATH: /app/AST-2.pdf
      CHROMA_DB_DIR: /app/chroma_db
    volumes:
      - chroma-data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  chroma-data:
